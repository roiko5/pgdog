#:schema ./.schema/users.schema.json
#
# Basic users configuration.
#
[[users]]
name = "pgdog"
database = "pgdog"
password = "pgdog"

[[users]]
name = "pgdog"
database = "pgdog_sharded"
password = "pgdog"

# Example: backend authentication with AWS RDS IAM token generation.
# PgDog still authenticates the client as configured by `general.auth_type`;
# this only affects how PgDog authenticates to PostgreSQL servers.
# server_auth = "rds_iam"
# server_iam_region = "us-east-1" # optional; auto-inferred from RDS hostname when omitted

# Example: backend authentication with Azure Workload Identity token generation.
# PgDog still authenticates the client as configured by `general.auth_type`;
# this only affects how PgDog authenticates to PostgreSQL servers.
# server_auth = "azure_workload_identity"

# Example: backend authentication with HashiCorp Vault dynamic credentials.
# Requires the [vault] section in pgdog.toml. PgDog fetches a generated
# username and password from `server_vault_path` and rotates them after
# `vault_refresh_percent` of the lease has elapsed.
# server_auth = "vault_dynamic"
# server_vault_path = "database/creds/pgdog"
# vault_refresh_percent = 80 # optional; default 80

# Example: client authentication against a HashiCorp Vault static database role.
# Requires the [vault] section in pgdog.toml. PgDog verifies the password the
# client sends against Vault's current password for the static role at `vault_path`,
# instead of a statically configured password.
# Independent of `server_auth` below; combine it with any backend authentication method.
# vault_path = "database/static-creds/alice"

# Example: client authentication with a presigned AWS STS token.
# Instead of a password, the client sends a presigned STS GetCallerIdentity URL
# (SigV4 query-signed, valid for at most 900 seconds) with the `x-pgdog-server-id`
# header — set to `sts_server_id` from pgdog.toml — included in its signed headers.
# The URL must be signed for GET: STS is a Query-protocol service, so SDKs
# presign GetCallerIdentity for POST by default, and PgDog replays the URL as a
# GET — a POST-signed URL always fails with SignatureDoesNotMatch. In botocore,
# pass HttpMethod="GET" to generate_presigned_url.
# PgDog executes the URL against STS and lets the client in only if the verified
# caller identity matches one of these IAM role ARNs (assumed-role ARNs are
# normalized to the IAM role they were assumed from before matching).
# Entries must be the path-less role ARN exactly as it appears in assumed-role
# ARNs (arn:aws:iam::<account>:role/<Name>); a path-qualified entry
# (role/some/path/<Name>) can never match because STS drops the path.
# The token is a short-lived bearer credential sent as a cleartext password,
# so also enable `tls_client_required` in pgdog.toml.
# Requires `sts_server_id` to be set in the [general] section of pgdog.toml.
# allowed_iam_arns = ["arn:aws:iam::123456789012:role/my-app-role"]

# Example: backend authentication with a HashiCorp Vault static role.
# Requires the [vault] section in pgdog.toml.
# server_user = "pgdog_service"
# server_auth = "vault_static"
# server_vault_path = "database/static-creds/pgdog-service"

# Example: let this user authenticate with a password over TLS without presenting
# a client certificate, while mTLS users share the same listener. Defaults to true.
# Only applies when `tls_client_ca_certificate` is set in pgdog.toml.
# tls_client_certificate_required = false
